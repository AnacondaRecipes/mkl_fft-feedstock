# Required for glibc >= 2.26 for intel-openmp to work.
pkg_build_image_tag: main-rockylinux-8

build_parameters:
  - "--suppress-variables"
  - "--error-overlinking"
  - "--error-overdepending"
  - "--no-test"

upload_channels:
  - ad-testing/label/py315

channels:
  - ad-testing/label/py315

build_env_vars:
  ANACONDA_ROCKET_GLIBC: "2.28"
  ANACONDA_ROCKET_ENABLE_PY315: True
