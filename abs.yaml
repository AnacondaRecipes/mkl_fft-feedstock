# Required for glibc >= 2.26 for intel-openmp to work.
pkg_build_image_tag: main-rockylinux-8

build_parameters:
  - "--suppress-variables"
  - "--error-overlinking"
  - "--error-overdepending"
  - "--no-test"

upload_channels:
  - ad-testing/label/py315

channels:
  - ad-testing/label/py315
  # numpy-base py315 is on PR staging until review-gated promotion.
  # mkl-service is also staged for numpy-base's runtime solve.
  # Strip both staging URLs before merge (U12).
  - https://staging.continuum.io/pbp/fs/numpy-feedstock/pr156/cf8cbe0
  - https://staging.continuum.io/pbp/fs/mkl-service-feedstock/pr9/87ff497

build_env_vars:
  ANACONDA_ROCKET_GLIBC: "2.28"
  ANACONDA_ROCKET_ENABLE_PY315: True
